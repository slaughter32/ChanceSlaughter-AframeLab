<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chance Slaughter Lab 11</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>

  <body style="margin: 0">
    <a-scene background="color: cyan" renderer="antialias: true">
      <!-- lighting -->
      <a-light type="ambient" color="#ffffff" intensity=".5"></a-light>
      <a-light
        type="directional"
        color="#ffffff"
        intensity=".5"
        position="-5 10 5"
      ></a-light>

      <!--Ground-->
      <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="100"
        height="100"
        color="white"
      ></a-plane>

      <!-- SNOWMAN -->
      <a-entity position="0 0 0">
        <!-- Snowballs -->
        <a-sphere position="0 0.65 0" radius="0.65" color="white"></a-sphere>
        <a-sphere position="0 1.55 0" radius="0.48" color="white"></a-sphere>
        <a-sphere position="0 2.25 0" radius="0.35" color="white"></a-sphere>

        <!-- Eyes and chest-->
        <a-sphere
          position="-0.15 2.35 0.3"
          radius="0.1"
          color="black"
        ></a-sphere>
        <a-sphere
          position="0.15 2.35 0.3"
          radius="0.1"
          color="black"
        ></a-sphere>
        <a-sphere position="0 1.75 0.5" radius="0.05" color="black"></a-sphere>
        <a-sphere position="0 1.5 0.5" radius="0.05" color="black"></a-sphere>
        <!--Nose-->
        <a-cone
          position="0 2.25 0.5"
          rotation="90 0 0"
          radius-bottom="0.1"
          height="0.5"
          color="orange"
        ></a-cone>
        <!--Arms-->
        <a-cylinder
          position="-0.65 1.65 0"
          rotation="0 0 -55"
          radius="0.04"
          height="0.8"
          color="brown"
        ></a-cylinder>
        <a-cylinder
          position="0.65 1.65 0"
          rotation="0 0 55"
          radius="0.04"
          height="0.8"
          color="brown"
        ></a-cylinder>
      </a-entity>
      <!--End of snowman-->

      <!--TREES-->
      <a-entity position="-3 0 -6">
        <a-cylinder
          position="0 0.5 0"
          radius="0.25"
          height="1"
          color="brown"
        ></a-cylinder>
        <a-cone
          position="0 2 0"
          radius-bottom="1"
          height="2.5"
          color="green"
        ></a-cone>
      </a-entity>
      <a-entity position="4 0 -3">
        <a-cylinder
          position="0 0.5 0"
          radius="0.25"
          height="1"
          color="brown"
        ></a-cylinder>
        <a-cone
          position="0 2 0"
          radius-bottom="1"
          height="2.5"
          color="green"
        ></a-cone>
      </a-entity>
      <a-entity position="2 0 -5">
        <a-cylinder
          position="0 0.5 0"
          radius="0.25"
          height="1"
          color="brown"
        ></a-cylinder>
        <a-cone
          position="0 2 0"
          radius-bottom="1"
          height="2.5"
          color="green"
        ></a-cone>
      </a-entity>
      <a-entity position="3 0 3">
        <a-cylinder
          position="0 0.5 0"
          radius="0.25"
          height="1"
          color="brown"
        ></a-cylinder>
        <a-cone
          position="0 2 0"
          radius-bottom="1"
          height="2.5"
          color="green"
        ></a-cone>
      </a-entity>
      <a-entity position="-3 0 3">
        <a-cylinder
          position="0 0.5 0"
          radius="0.25"
          height="1"
          color="brown"
        ></a-cylinder>
        <a-cone
          position="0 2 0"
          radius-bottom="1"
          height="2.5"
          color="green"
        ></a-cone>
      </a-entity>
      <a-entity position="-4 0 1">
        <a-cylinder
          position="0 0.5 0"
          radius="0.25"
          height="1"
          color="brown"
        ></a-cylinder>
        <a-cone
          position="0 2 0"
          radius-bottom="1"
          height="2.5"
          color="green"
        ></a-cone>
      </a-entity>
      <a-entity position="-5 0 -4">
        <a-cylinder
          position="0 0.5 0"
          radius="0.25"
          height="1"
          color="brown"
        ></a-cylinder>
        <a-cone
          position="0 2 0"
          radius-bottom="1"
          height="2.5"
          color="green"
        ></a-cone>
      </a-entity>
      <a-entity position="5 0 2">
        <a-cylinder
          position="0 0.5 0"
          radius="0.25"
          height="1"
          color="brown"
        ></a-cylinder>
        <a-cone
          position="0 2 0"
          radius-bottom="1"
          height="2.5"
          color="green"
        ></a-cone>
      </a-entity>

      <!--Modified Isometric Camera-->
      <a-entity position="8 8 9" rotation="-40 40 0">
        <a-camera
          camera="fov: 60"
          look-controls="enabled: false"
          wasd-controls="enabled: false"
        >
        </a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
